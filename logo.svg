<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="aiPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular badge with subtle border -->
  <circle cx="60" cy="60" r="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
  
  <!-- Outer AI circuit ring orbit -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- AI Circuit lines connecting to toes -->
  <path d="M60 22 L60 38" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
  <path d="M34 32 L44 46" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
  <path d="M86 32 L76 46" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
  
  <!-- Neural Nodes -->
  <circle cx="60" cy="22" r="3" fill="#22c55e" />
  <circle cx="34" cy="32" r="3" fill="#22c55e" />
  <circle cx="86" cy="32" r="3" fill="#22c55e" />

  <!-- Animal Paw - Main Pad -->
  <path d="M60 55 C46 55 35 66 38 82 C40 92 50 97 60 97 C70 97 80 92 82 82 C85 66 74 55 60 55 Z" fill="url(#pawGrad)" />

  <!-- Paw digital AI core circuit in center of main pad -->
  <circle cx="60" cy="74" r="8" fill="#ffffff" opacity="0.9" />
  <circle cx="60" cy="74" r="4" fill="#15803d" />
  <path d="M52 74 L44 74" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M68 74 L76 74" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M60 66 L60 59" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M60 82 L60 89" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Animal Paw - 4 Toes with AI connectivity -->
  <!-- Toe 1 (Far Left) -->
  <ellipse cx="32" cy="50" rx="7" ry="10" transform="rotate(-25 32 50)" fill="url(#pawGrad)" />
  <!-- Toe 2 (Center Left) -->
  <ellipse cx="49" cy="38" rx="8" ry="12" transform="rotate(-8 49 38)" fill="url(#pawGrad)" />
  <!-- Toe 3 (Center Right) -->
  <ellipse cx="71" cy="38" rx="8" ry="12" transform="rotate(8 71 38)" fill="url(#pawGrad)" />
  <!-- Toe 4 (Far Right) -->
  <ellipse cx="88" cy="50" rx="7" ry="10" transform="rotate(25 88 50)" fill="url(#pawGrad)" />

  <!-- AI spark / pulse wave -->
  <path d="M22 60 Q 28 55, 34 60 T 46 60 T 58 60 T 70 60 T 82 60 T 98 60" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4" />
</svg>
