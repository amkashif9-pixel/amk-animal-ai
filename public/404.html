<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMK Animal AI</title>
    <script>
      // Single Page App Fallback for GitHub Pages and Hosting
      (function () {
        var l = window.location;
        var isGitHubPages = l.hostname.indexOf('github.io') !== -1;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var repo = (isGitHubPages && pathSegments.length > 0) ? '/' + pathSegments[0] : '';
        var pathSegmentsToKeep = isGitHubPages ? 1 : 0;
        var route = pathSegments.slice(pathSegmentsToKeep).join('/');
        
        var destination = repo + '/#/' + route + (l.search ? l.search : '') + (l.hash ? l.hash : '');
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">AMK Animal AI</a>...</p>
  </body>
</html>
